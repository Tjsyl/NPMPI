[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "npmpi"
version = "0.2.1"
description = "Unified CLI + desktop GUI for managing Nginx Proxy Manager + Pi-hole hostnames across two sites"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Travis Sylvester" }]
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
npmpi = "npmpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
