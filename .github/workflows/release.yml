name: Build and release npmpi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e .

      - name: Install UPX
        shell: pwsh
        run: |
          # Downloaded directly from UPX's own GitHub release rather than via
          # choco - the Chocolatey community feed is prone to transient 503s,
          # which silently skip compression without failing the build.
          $upxUrl = "https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-win64.zip"
          $installed = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest -Uri $upxUrl -OutFile upx.zip -UseBasicParsing
              Expand-Archive -Path upx.zip -DestinationPath upx_extracted -Force
              $upxDir = Get-ChildItem -Path upx_extracted -Directory | Select-Object -First 1
              Add-Content -Path $env:GITHUB_PATH -Value $upxDir.FullName
              Write-Host "UPX installed to $($upxDir.FullName)"
              $installed = $true
              break
            } catch {
              Write-Host "UPX download attempt $i failed: $_"
              Start-Sleep -Seconds 5
            }
          }
          if (-not $installed) {
            Write-Host "Could not install UPX after 3 attempts - proceeding without compression."
          }

      - name: Determine installer version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $v = "0.0.0-dev"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Generate Windows version-info resource
        shell: pwsh
        run: python scripts/gen_version_info.py "${{ steps.ver.outputs.version }}" version_info.txt

      - name: Build CLI exe (npmpi.exe, --onedir)
        run: |
          pyinstaller --onedir --noconfirm --name npmpi --console --version-file version_info.txt --icon src/npmpi/gui/assets/icon.ico --add-data "src/npmpi/gui/assets;npmpi/gui/assets" --collect-all customtkinter --paths src src/npmpi/__main__.py

      - name: Build GUI exe (npmpigui.exe, --onedir)
        run: |
          pyinstaller --onedir --noconfirm --name npmpigui --windowed --version-file version_info.txt --icon src/npmpi/gui/assets/icon.ico --add-data "src/npmpi/gui/assets;npmpi/gui/assets" --collect-all customtkinter --paths src src/npmpi/gui_main.py

      # --onedir builds are folders, not single files - GitHub release assets
      # must be single files, so zip each folder up for distribution. Each
      # zip's root contains the exe directly (npmpi.exe, _internal\, etc.)
      # rather than a wrapping folder, so install.ps1 can just extract it
      # straight into <InstallDir>\npmpi\ / <InstallDir>\npmpigui\.
      - name: Package onedir builds as zips
        shell: pwsh
        run: |
          Compress-Archive -Path dist/npmpi/* -DestinationPath dist/npmpi-windows.zip
          Compress-Archive -Path dist/npmpigui/* -DestinationPath dist/npmpigui-windows.zip

      - name: Upload exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npmpi-windows-exe
          path: |
            dist/npmpi-windows.zip
            dist/npmpigui-windows.zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" npmpi_installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: npmpi-windows-installer
          path: installer_output/npmpi-setup.exe

      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/npmpi-windows.zip
            dist/npmpigui-windows.zip
            installer_output/npmpi-setup.exe
