name: Build and release npmpi.exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e .

      - name: Install UPX
        run: choco install upx -y --no-progress

      - name: Build one-file exe
        run: |
          pyinstaller --onefile --name npmpi --console --paths src src/npmpi/__main__.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: npmpi-windows-exe
          path: dist/npmpi.exe

      - name: Determine installer version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $v = "0.0.0-dev"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" npmpi_installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: npmpi-windows-installer
          path: installer_output/npmpi-setup.exe

      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/npmpi.exe
            installer_output/npmpi-setup.exe
