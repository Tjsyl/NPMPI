name: Build and release npmpi.exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e .

      - name: Build one-file exe
        run: |
          pyinstaller --onefile --name npmpi --console --paths src src/npmpi/__main__.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: npmpi-windows-exe
          path: dist/npmpi.exe

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/npmpi.exe
